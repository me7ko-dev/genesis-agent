[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-agent"
# Едно място за номера: genesis_agent/__init__.py. Беше на три, с три
# различни стойности.
dynamic = ["version"]
description = "Self-hosted autonomous coding agent with a library of verified, executable skills and memory that survives sessions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Me7ko__" }]
keywords = ["ai", "agent", "autonomous", "llm", "coding-assistant", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]

# Deliberately small. Everything heavier is an extra, so `pip install
# genesis-agent` stays fast and the browser stack is opt-in.
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
# Vertex AI: OAuth вместо статичен ключ (genesis_agent/vertex_auth.py).
# Само за Vertex — Gemini през AI Studio работи с обикновен ключ и
# не иска нищо допълнително.
google = ["google-auth>=2.0"]
dev = ["pytest>=8.0"]                    # test suite, see tests/
browser = ["playwright>=1.40"]           # then: playwright install chromium
quality = ["ruff>=0.6"]                  # code_validate.py pre-checks generated code
signing = ["cryptography>=42"]           # cryptography_utils.py — RSA skill signing
# Only needed for the paid MAX tier (GENESIS_QUALITY=max) — Anthropic's Messages
# API is not OpenAI-compatible, so it needs its own SDK. Everything else in the
# chain speaks the OpenAI wire format over plain `requests`.
premium = ["anthropic>=0.40"]
# `genesis serve` — the phone app (mobile/): encrypted channel + QR pairing.
mobile = ["cryptography>=42", "qrcode>=7.4"]
all = [
    "qrcode>=7.4",
    "playwright>=1.40",
    "ruff>=0.6",
    "cryptography>=42",
    "anthropic>=0.40",
    "google-auth>=2.0",
]

[project.urls]
Homepage = "https://github.com/me7ko-dev/genesis-agent"
Issues = "https://github.com/me7ko-dev/genesis-agent/issues"
Security = "https://github.com/me7ko-dev/genesis-agent/blob/main/SECURITY.md"

[project.scripts]
genesis = "genesis_agent.cli:main"

[tool.setuptools.dynamic]
version = {attr = "genesis_agent.__version__"}

[tool.setuptools]
packages = ["genesis_agent"]
# Both are top-level modules the CLI loads at runtime. Omitting
# genesis_terminal_agent left `genesis` — the headline command — crashing with
# FileNotFoundError on every installed copy.
py-modules = ["genesis_skills", "genesis_terminal_agent"]

[tool.setuptools.package-data]
# These live inside the package. When they sat beside it (named here as
# "../config.yaml" and friends) an installed copy unpacked `config.yaml`,
# `skills/` into site-packages itself — top-level names generic enough that an
# unrelated project's import could have found ours.
# Anything missing from this list is missing from an installed copy while
# still working from a git checkout: exactly the gap that only shows up for
# other people.
genesis_agent = [
    "config.yaml",
    "skills/*.md",
    "skills/skills.json",
]

[tool.pytest.ini_options]
addopts = "--ignore=scripts --ignore=bench"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
ignore = [
    # datetime.now()/date.today() without tzinfo: every flagged call site
    # compares against another naive call from the same process (self-consistent,
    # no aware/naive mixing bug) or formats a filename/display string for the
    # user's local clock, where UTC would be the wrong, more confusing choice.
    "DTZ005", "DTZ006", "DTZ011",
]

# BLE001/S110 (сляпо `except Exception`, `except: pass`) са включени. Всяко
# прихващане или е стеснено до грешките, които наистина могат да дойдат,
# или е граница, която нарочно не спира работата — тогава записва грешката
# със следата (log.debug(..., exc_info=True); вижда се с GENESIS_DEBUG=1).
# Файловете отдолу още не са минати; списъкът само намалява (2026-10-04).
[tool.ruff.lint.per-file-ignores]
"cloud/egress/proxy.py" = ["BLE001", "S110"]
"cloud/runner/task.py" = ["BLE001", "S110"]
"cloud/web/server.py" = ["BLE001", "S110"]
"genesis_agent/acceptance.py" = ["BLE001", "S110"]
"genesis_agent/autonomous_loop.py" = ["BLE001", "S110"]
"genesis_agent/benchmark.py" = ["BLE001", "S110"]
"genesis_agent/browser.py" = ["BLE001", "S110"]
"genesis_agent/budget.py" = ["BLE001", "S110"]
"genesis_agent/cryptography_utils.py" = ["BLE001", "S110"]
"genesis_agent/delegate.py" = ["BLE001", "S110"]
"genesis_agent/embeddings.py" = ["BLE001", "S110"]
"genesis_agent/local_repair_agent.py" = ["BLE001", "S110"]
"genesis_agent/memory.py" = ["BLE001", "S110"]
"genesis_agent/model_router.py" = ["BLE001", "S110"]
"genesis_agent/notifier.py" = ["BLE001", "S110"]
"genesis_agent/orchestrator.py" = ["BLE001", "S110"]
"genesis_agent/page_check_runner.py" = ["BLE001", "S110"]
"genesis_agent/provider_stats.py" = ["BLE001", "S110"]
"genesis_agent/reflection.py" = ["BLE001", "S110"]
"genesis_agent/remote_server.py" = ["BLE001", "S110"]
"genesis_agent/research.py" = ["BLE001", "S110"]
"genesis_agent/sandbox.py" = ["BLE001", "S110"]
"genesis_agent/skill_loader.py" = ["BLE001", "S110"]
"genesis_agent/skills_manager.py" = ["BLE001", "S110"]
"genesis_agent/telemetry.py" = ["BLE001", "S110"]
"genesis_agent/version_info.py" = ["BLE001", "S110"]
"genesis_agent/vertex_auth.py" = ["BLE001", "S110"]
"genesis_agent/web_check.py" = ["BLE001", "S110"]
"genesis_agent/web_search.py" = ["BLE001", "S110"]
"genesis_agent/workspace_memory.py" = ["BLE001", "S110"]
"packaging/genesis_entry.py" = ["BLE001", "S110"]
"scripts/bench_fix.py" = ["BLE001", "S110"]
"scripts/bench_models.py" = ["BLE001", "S110"]
"scripts/capability_report.py" = ["BLE001", "S110"]
"tests/conftest.py" = ["BLE001", "S110"]
"tests/test_state_isolation.py" = ["BLE001", "S110"]

[tool.mypy]
# Optional third-party libs (playwright, google-auth, anthropic) may be
# missing or ship no type stubs. Without this, mypy
# on those files is 100% import-resolution noise, not real findings.
ignore_missing_imports = true
# Телата на функциите без анотации също се проверяват. Без това mypy
# прескачаше точно стария код (терминалът, менютата), а там бяха и трите
# грешки, които излязоха при включването (2026-10-04).
check_untyped_defs = true
