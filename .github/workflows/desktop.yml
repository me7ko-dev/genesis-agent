name: Desktop app

# Genesis Desktop (desktop/): the Electron window around `genesis serve`.
# Typecheck, the protocol tests against the real Python server, and the
# Windows installer as a build artifact. Built here and not on the operator's
# machine: Smart App Control blocks a freshly built, unsigned installer there.

on:
  push:
    branches: [main]
    paths: ["desktop/**", "genesis_agent/remote_server.py", "genesis_agent/desktop_commands.py", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "genesis_agent/remote_server.py", "genesis_agent/desktop_commands.py", ".github/workflows/desktop.yml"]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: pip install -e "..[mobile]"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build the installer
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: genesis-desktop-setup
          path: desktop/release/Genesis-Setup-*.exe
          if-no-files-found: error
