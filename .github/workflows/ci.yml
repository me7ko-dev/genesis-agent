name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # 2026-10-15: a hung test on Windows held the job for 45+ min with no
    # output (the default limit is 6 h). Normal Windows run is ~20 min; 90
    # leaves room for --durations to print when it is only slow.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12", "3.13"]
        include:
          # One Windows leg is enough to catch platform regressions (path
          # handling, console encoding, permission-model assumptions) — the
          # kind of bug that has repeatedly slipped in silently because this
          # matrix never ran anywhere but Linux.
          - os: windows-latest
            python-version: "3.12"
    # windows-latest defaults `run:` steps to pwsh, which can't parse this
    # file's bash syntax (if/grep/heredoc-style blocks below). Force Git
    # Bash — present on every GitHub-hosted Windows runner — everywhere so
    # the same steps run unmodified on both platforms.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # signing extra pulled in so
          # tests/test_cryptography_utils.py actually run instead of silently
          # skipping via pytest.importorskip.
          pip install -e .[dev,signing]
          # Pinned: this step exists to gate a "0 findings" claim, and an
          # unpinned tool version silently re-breaking that claim on its own
          # release schedule is exactly the drift it was added to prevent.
          # Bump deliberately, in the same commit that fixes whatever the
          # new version flags.
          pip install mypy==2.3.1 ruff==0.16.8

      - name: Everything imports and compiles
        run: |
          python -m compileall -q genesis_agent/ scripts/ *.py
          python -c "import genesis_agent.brain, genesis_agent.sandbox, genesis_agent.paths"

      # Commit messages have claimed "0 mypy errors" before and drifted (a
      # dependency version bump silently broke cryptography_utils.py's type
      # checks without anyone noticing). Gate it in CI so that claim can't go
      # stale again.
      - name: Type check (mypy)
        run: python -m mypy genesis_agent/ genesis_skills.py genesis_terminal_agent.py cloud/

      # Was never wired up before: `ruff` only ran INSIDE code_validate.py to
      # vet LLM-generated code, never over the codebase's own source. 620
      # pre-existing findings got fixed/annotated to reach a clean baseline
      # (see pyproject.toml's [tool.ruff.lint] ignore comment for the two
      # rules — BLE001/S110 — still carrying deliberate, documented debt).
      # Gate it here so nothing new drifts back in.
      - name: Lint (ruff)
        run: python -m ruff check .

      # Real unit tests, isolated from the user's actual ~/.genesis data
      # (every test that touches persisted state monkeypatches the module's
      # path constant to a tmp file — see tests/conftest.py). No API keys or
      # network needed: LLM calls are faked, ruff/sandbox subprocess calls
      # either use a real local binary or mock subprocess directly.
      - name: Unit tests (pytest)
        run: python -m pytest -q --durations=25

      # The genesis.metko.uk waitlist function (site/). Node is preinstalled
      # on every GitHub-hosted runner; the test fakes KV, no network.
      - name: Waitlist function (node)
        run: node --test site/functions/api/waitlist.test.mjs

      # The sandbox is the safety boundary — if it regresses, nothing else
      # matters. These checks need no API key and no network.
      - name: Sandbox classification
        run: python -m genesis_agent.sandbox

      # The Windows installer's own logic, run by the Windows PowerShell the
      # users actually have. `shell: powershell` is 5.1 on GitHub runners, not
      # pwsh 7 — the point is to catch syntax or cmdlet use that only 7
      # accepts. Nothing is installed; -SelfTest exercises the decisions
      # (version floor, WSL-launcher detection) and prints OK.
      - name: Windows installer self-test
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\install_windows.ps1 -SelfTest

      - name: No secrets committed
        run: |
          if grep -rEn "(sk-[a-zA-Z0-9]{20,}|hf_[a-zA-Z0-9]{25,}|gsk_[a-zA-Z0-9]{25,}|nvapi-[a-zA-Z0-9]{25,}|discord\.com/api/webhooks/[0-9]{8,})" \
               --include="*.py" --include="*.yaml" --include="*.sh" --include="*.md" . ; then
            echo "::error::Something that looks like a real credential is committed."
            exit 1
          fi
          echo "clean"

  # Сървърът (cloud/) се сглобява и пуска при всеки PR (2026-11-13): деплоят
  # на истинската машина беше проверяван само на ръка. GitHub runner-ът има
  # Docker и sudo без парола — като чист Ubuntu сървър, само без ключове.
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Deploy dry run
        run: |
          printf 'GATEWAY_SECRET=%s\nGROQ_API_KEY=x\nGATEWAY_MODELS=groq/openai/gpt-oss-120b\n' \
            "$(openssl rand -hex 24)" > "$RUNNER_TEMP/keys.env"
          chmod 600 "$RUNNER_TEMP/keys.env"
          printf -- '--billing --public-url https://genesis.example.org\n' > "$RUNNER_TEMP/web.args"
          DEPLOY_DRY_RUN=1 DEPLOY_DRY_DIR="$RUNNER_TEMP/dry" GENESIS_DOMAIN=genesis.example.org \
            GENESIS_KEYS="$RUNNER_TEMP/keys.env" GENESIS_WEB_ARGS_FILE="$RUNNER_TEMP/web.args" \
            GENESIS_MONITOR_ENV="$RUNNER_TEMP/none" GENESIS_STRIPE_ENV="$RUNNER_TEMP/none" \
            ./cloud/deploy.sh | tee "$RUNNER_TEMP/dry.log"
          grep -q "режим: gateway" "$RUNNER_TEMP/dry.log"
          grep -q -- "--billing --public-url https://genesis.example.org" "$RUNNER_TEMP/dry/genesis-web"
          # шаблоните на systemd са валидни (само синтаксис — без systemd като PID 1 няма пускане)
          systemd-analyze verify --man=no "$RUNNER_TEMP"/dry/*.service 2>&1 | tee "$RUNNER_TEMP/verify.log" || true
          ! grep -E "Unknown (key|section)|Invalid|bad-setting" "$RUNNER_TEMP/verify.log"

      - name: Build images (cloud/build.sh)
        run: bash cloud/build.sh

      # Мярката от етап 1 (изолация, тавани, задача без модел) — cloud/check.py
      # по истинския път на задача. Без ключове: шлюзът е с фалшив GROQ ключ,
      # задачата не вика модел. bench_fix 12/12 иска истински ключ и интернет
      # от контейнера — не се пуска тук (README, „Известно и отложено“).
      - name: Proxy mode — up.sh + check.py
        run: |
          sudo mkdir -p /srv/genesis
          printf 'GROQ_API_KEY=x\n' | sudo tee /srv/genesis/keys-proxy.env >/dev/null
          sudo GENESIS_KEYS=/srv/genesis/keys-proxy.env bash cloud/up.sh
          sudo python3 -m cloud.check --jobs "$RUNNER_TEMP" --min-free-gb 2

      - name: Gateway mode — up.sh + check.py
        run: |
          sudo cp "$RUNNER_TEMP/keys.env" /srv/genesis/keys.env
          sudo GENESIS_KEYS=/srv/genesis/keys.env bash cloud/up.sh
          sudo python3 -m cloud.check --jobs "$RUNNER_TEMP" --min-free-gb 2

      - name: Web server with billing starts and serves the legal pages
        run: |
          sudo mkdir -p /srv/genesis/web /srv/jobs
          printf '{"ПРОДАВАЧ": "CI"}' > "$RUNNER_TEMP/legal.json"
          sudo python3 -m cloud.web.server serve --data /srv/genesis/web --jobs /srv/jobs \
            --env-file /srv/genesis/keys.env --gateway-usage /srv/genesis/gateway/usage.jsonl \
            --billing --legal "$RUNNER_TEMP/legal.json" --port 8080 > "$RUNNER_TEMP/web.log" 2>&1 &
          for _ in $(seq 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/legal/terms | grep -q "CI"
          curl -fsS "http://127.0.0.1:8080/legal/privacy?lang=en" | grep -q "Privacy Policy"
          sudo python3 -m cloud.check --jobs "$RUNNER_TEMP" --min-free-gb 2 --web http://127.0.0.1:8080
          sudo pkill -f "cloud.web.server serve" || true
          cat "$RUNNER_TEMP/web.log"
