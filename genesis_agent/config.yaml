# Genesis Agent — configuration.
#
# NO SECRETS IN THIS FILE. It is committed to git. API keys belong in
# ~/.genesis/.env (created by `genesis setup`), which is gitignored.
#
# The model chain below is ordered strongest-first. Any provider you have no
# key for is skipped automatically, so you can start with one key and add more
# later without editing anything here.

# Paths are resolved in genesis_agent/paths.py. Leave these empty to use the
# defaults (project directory / ~/.genesis / XDG data dir), or set them to
# override. `~` is expanded.
workspace:
  path: ""

storage:
  history_dir: ""

models:
  # Верига от големи+бързи модели, няколко доставчика с ОТДЕЛНИ квоти.
  # brain.py я обхожда ВИНАГИ отгоре надолу, прескачайки временно изчерпаните
  # (429/402/503 → cooldown). Локалният модел е последна резерва; за изричен
  # офлайн режим виж GENESIS_LOCAL_ONLY.
  # HuggingFace беше пръв тук до 2026-07-30, когато `HF_TOKEN` изчерпа месечните
  # си кредити (HTTP 402, проверено директно). Дотогава ВСЯКО обаждане чукаше
  # първо на мъртъв доставчик. `_mark_exhausted` го прескача след първия провал
  # за 5 минути, така че не е фатално — но по подразбиране да води доставчик,
  # който не отговаря, е грешно.
  # Ollama Cloud поема водачеството: отделна квота (~5M токена/седмица), реално
  # обслужваше всички repair пускове в деня на смяната, 120B, native tools.
  # Щом HF кредитът се поднови, върни го напред — 685B DeepSeek-V3 на отделна
  # квота е ценен точно когато другите се изчерпят.
  default_provider: "ollama_cloud"
  default_model_id: "gpt-oss:120b-cloud"
  context_window: 131072

  # МИНИМУМ ~20-30B параметъра за ВСЕКИ модел във веригата (design note, 2026-07-25:
  # по-малките мислят и отговарят забележимо по-слабо). Малките резервни модели
  # (Llama-3.1-8B, command-r7b, openrouter/free) са премахнати изцяло — не само
  # деприоритизирани, защото при верижен fallback дори "резерва" реално се вика.
  #
  # `size_b` (design note, 2026-07-25): изричен размер в милиарди параметри на всеки
  # модел — brain.py филтрира по него (`Brain(min_size_b=...)`) за различни
  # контексти: Discord чат ≥17B, терминален чат ≥32B, умения/самонадграждане
  # ≥120B. За MoE модели (Mixtral 8x7B) е записан ОБЩИЯТ брой параметри (46.7B),
  # не активните-на-токен (12.9B) — иначе размерът реално ощетява модела.
  # Ollama Cloud е преместен НАПРЕД (design note): най-големият свободен пул
  # (~5M токена/седмица ×4 ключа) — пести по-тесните квоти на HF/OpenRouter.
  #
  # `supports_tools` (design note, 2026-07-25): дали моделът приема native OpenAI
  # `tools=[...]` параметър и реално връща структуриран `tool_calls` (не
  # просто приема параметъра без грешка — тествано наживо с curl, реален
  # tool_call в отговора). Проверени ВСИЧКИ 13 модела директно: само
  # Qwen2.5-Coder-32B (400 UNSUPPORTED_OPENAI_PARAMS от HF router) и NVIDIA
  # Mixtral (400 — vLLM сървърът няма --enable-auto-tool-choice) НЕ поддържат.
  # `brain.py` пробва tools-способните пръв в native режим, после пада към
  # останалите в стар text-tag режим (`[RUN_CMD: ...]` в промпта).
  fallback_models:

    # ─── Ollama Cloud (отделна квота, 4 ключа — добавени 2026-07-25, ~5M
    # токена/седмица безплатно ОБЩО, много по-големи модели от локалните
    # 3b/7b/14b; :cloud суфикс, OpenAI-съвместим. ВНИМАНИЕ: не всеки :cloud
    # модел е безплатен — kimi-k2.7-code/qwen3.5:397b/deepseek-v4-flash
    # върнаха 403 (изискват платен ъпгрейд), проверено наживо. Само
    # ПОТВЪРДЕНИ безплатни модели тук — провери с curl преди да добавиш нов.
    # Преместен НАПРЕД (design note, 2026-07-25) — най-големият свободен пул. ──────
    - provider: "ollama_cloud"
      model: "gpt-oss:120b-cloud"          # голям общ, потвърден наживо (200)
      size_b: 120
      supports_tools: true    # потвърдено наживо
    - provider: "ollama_cloud"
      model: "nemotron-3-ultra:cloud"      # NVIDIA голям, потвърден наживо (200)
      size_b: 253   # точен брой неизвестен, вероятно същото семейство като
                     # OpenRouter nemotron-3-ultra-550b — консервативна оценка
      supports_tools: true    # потвърдено наживо

    # ─── OpenRouter free (голям, но споделена квота) ────────────────
    - provider: "openrouter"
      model: "nvidia/nemotron-3-ultra-550b-a55b:free"  # 550B когато е свободен
      size_b: 550
      supports_tools: true    # потвърдено наживо
    - provider: "openrouter"
      model: "nvidia/nemotron-3-super-120b-a12b:free"
      size_b: 120
      supports_tools: true    # потвърдено наживо
    - provider: "openrouter"
      model: "google/gemma-4-31b-it:free"
      size_b: 31
      supports_tools: true    # потвърдено наживо

    # ─── HuggingFace (големи и бързи ~1с, отделна квота) ─────────────
    # Преместен от ПЪРВО на това място 2026-07-30: `HF_TOKEN` изчерпа месечните
    # си кредити (HTTP 402). Оставен във веригата, а не изтрит — 685B DeepSeek-V3
    # на отделна квота е сред най-силните тук и се връща от само себе си, щом
    # кредитът се поднови (402 → cooldown, после нормален опит). Ако станеш PRO
    # или купиш кредит, върни целия блок най-отгоре.
    - provider: "huggingface"
      model: "deepseek-ai/DeepSeek-V3-0324"        # МАКС голям (685B)
      size_b: 685
      supports_tools: true    # потвърдено наживо, реален tool_call
    - provider: "huggingface"
      model: "meta-llama/Llama-3.3-70B-Instruct"   # 70B бърз
      size_b: 70
      supports_tools: true    # потвърдено наживо
    - provider: "huggingface"
      model: "Qwen/Qwen2.5-72B-Instruct"           # 72B
      size_b: 72
      supports_tools: true    # тестът върна 402 (изчерпан кредит), не 400
                               # unsupported-param — параметърът мина валидация
    - provider: "huggingface"
      model: "Qwen/Qwen2.5-Coder-32B-Instruct"   # най-добър КОДИНГ (32B)
      size_b: 32
      supports_tools: false   # 400 UNSUPPORTED_OPENAI_PARAMS, проверено наживо

    # ─── NVIDIA native (отделна квота, 2 ключа; MoE 8x7B ≈ 46.7B общо) ──
    - provider: "nvidia"
      model: "mistralai/mixtral-8x7b-instruct-v0.1"
      size_b: 47
      supports_tools: false   # 400: vLLM сървърът няма --enable-auto-tool-choice,
                               # не е нещо, което ние можем да фиксираме от клиента

    # ─── Groq (отделна квота, 3 ключа — добавени 2026-07-24, проверени
    # наживо; по-рано отсъстваше от веригата заради стар 403 блок) ────
    - provider: "groq"
      model: "llama-3.3-70b-versatile"
      size_b: 70
      supports_tools: true    # потвърдено наживо (с валиден ключ, не #1)

  # ─── КОДИНГ верига — `/maxcoding` (design note, 2026-07-30) ────────────────
  # Изцяло БЕЗПЛАТНА. Влиза само при `/maxcoding` в чата, `genesis fix
  # --maxcoding`, или `GENESIS_QUALITY=coding` — и автоматично при MAX режим
  # без платен ключ. Обичайната верига остава резерва под нея.
  #
  # Не е просто „същите модели, подредени по size_b": подборът е по годност за
  # работа по код. Всички са проверени наживо (OpenRouter /models, 2026-07-30),
  # че поддържат native tool-calling — без него repair цикълът пада в текстов
  # режим, който работи, но е измеримо по-крехък.
  #
  # ПОДРЕДБАТА Е ИЗМЕРЕНА, не предположена (2026-07-30, `scripts/bench_models.py`,
  # 6 от трудните задачи в benchmark.py, всеки модел закован сам във веригата):
  #   100%  6/6   37s  inclusionai/ling-3.0-flash:free
  #   100%  6/6   38s  poolside/laguna-s-2.1:free
  #   100%  6/6   69s  nvidia/nemotron-3-ultra-550b-a55b:free
  #    83%  5/6  143s  nvidia/nemotron-3-super-120b-a12b:free
  #    67%  4/6  914s  cohere/north-mini-code:free      → изхвърлен
  # Извадката е малка нарочно (безплатният OpenRouter tier е ~50 заявки/ден и
  # не искахме бенчмаркът да изяде дневната квота) — тя различава „счупен от
  # „работещ", не третия от четвъртия.
  #
  # КОРЕКЦИЯ след живо ползване (2026-07-30, същия ден): първоначално laguna
  # беше пръв — качеството е там, но пропускателната способност не е.
  # `poolside/laguna-s-2.1:free` обслужва ЕДНО обаждане и после връща 429
  # (upstream лимит на Poolside, не на акаунта: в същата секунда, със същия
  # ключ, ling и nemotron отговарят нормално). Видяно три пъти независимо —
  # два реални пуска и директен тест. В многорундов repair цикъл това значи
  # един рунд от него и всичко останало от резервата.
  #
  # Затова водач е `ling-3.0-flash` — същите 100%, най-бърз, и издържа
  # последователни обаждания (проверено 4 подред). Бенчмаркът мери КАЧЕСТВО на
  # един отговор; веригата има нужда и от честота. laguna остава — когато е
  # свободен, е отличен, а `_mark_exhausted` го прескача за 5 минути след 429.
  #
  # `cohere/north-mini-code` е изхвърлен въпреки че е кодинг-модел: 914 секунди
  # за 6 задачи и два празни отговора. Специализацията не помага, ако моделът е
  # претоварен точно когато ти трябва.
  #
  # HuggingFace НЕ е тук: `HF_TOKEN` е с изчерпани месечни кредити (HTTP 402,
  # проверено наживо 2026-07-30), тоест DeepSeek-V3 685B в момента е недостъпен
  # и само би хабил по един опит. Върни го, щом кредитът се поднови — 685B на
  # ОТДЕЛНА квота е ценен точно когато OpenRouter свърши.
  #
  # `ollama_cloud` е последен НЕ защото е най-слаб, а защото е на трета,
  # независима квота: първите четири споделят един OpenRouter акаунт, така че
  # без него цялата верига пада наведнъж, когато той се изчерпи.
  #
  # Цената на режима не е в пари, а в квота и скорост: това са най-търсените
  # безплатни модели, тоест най-често заетите. Затова НЕ е по подразбиране.
  coding_models:
    - provider: "openrouter"
      model: "inclusionai/ling-3.0-flash:free"          # 124B MoE / 5.1B активни, най-бърз
      size_b: 124                                       # издържа последователни обаждания
      supports_tools: true
    - provider: "openrouter"
      model: "nvidia/nemotron-3-ultra-550b-a55b:free"   # 550B/55B активни, 1M контекст
      size_b: 550
      supports_tools: true
    - provider: "openrouter"
      model: "poolside/laguna-s-2.1:free"               # кодинг-агентен, 118B/8B активни
      size_b: 118                                       # 70.2% Terminal-Bench 2.1 (по Poolside)
      supports_tools: true                              # ~1 обаждане, после 429 — виж горе
    - provider: "openrouter"
      model: "nvidia/nemotron-3-super-120b-a12b:free"
      size_b: 120
      supports_tools: true
    - provider: "ollama_cloud"
      model: "gpt-oss:120b-cloud"                       # ОТДЕЛНА квота — застраховка
      size_b: 120
      supports_tools: true

  # ─── ПЛАТЕНИ модели — MAX режим (design note, 2026-07-30) ──────────────────
  # Тези НЕ са част от нормалната верига. Влизат само когато операторът изрично
  # поиска `GENESIS_QUALITY=max` (или `genesis fix --max`) И само ако ключът за
  # доставчика реално съществува. Без ключ поведението е непроменено —
  # безплатната верига, същият ред, нула разлика.
  #
  # Защо изобщо съществуват: за поправка на чужд код таванът на безплатния слой
  # е реален и измерим. 21-задачният hard benchmark (genesis_agent/benchmark.py)
  # показва къде свършват безплатните модели; за трудния случай платеният модел
  # е разликата между поправка и правдоподобно изглеждаща грешка. Кога да се
  # плати остава решение на оператора, не на кода.
  #
  # Редът е "най-способният пръв". Всеки, за когото няма ключ, се пропуска.
  premium_models:
    - provider: "anthropic"
      model: "claude-opus-5"          # native Messages API (не OpenAI-съвместим)
      supports_tools: true
      effort: "xhigh"                 # препоръчаното ниво за кодинг/агентна работа
    - provider: "openai"
      model: "gpt-5.5"                # проверено наживо срещу GET /v1/models, 2026-07-30
      supports_tools: true
    - provider: "deepseek"
      model: "deepseek-chat"          # най-евтиният смислен платен вариант
      supports_tools: true
  # Имената на моделите се менят по-често от този файл. Ако някой запис върне
  # 404, веригата просто пада на следващия — но си струва да се провери:
  #   curl -s https://api.openai.com/v1/models -H "Authorization: Bearer $OPENAI_API_KEY"
  # (GET /v1/models проверява авторизацията, без да харчи квота — за разлика от
  # POST /chat/completions, където „моделът го няма" изглежда като „ключът е лош".)
discord:
  webhook: ""
  bot_token: ""

system_prompt: |
  CRITICAL IDENTITY: You are Genesis Agent — a self-hosted autonomous AI coding agent.
  You are NOT Meta AI, NOT OpenAI GPT, NOT Claude, NOT Gemini, NOT any other AI. You are GENESIS.
  If anyone asks what you are — you are Genesis Agent, running locally on your operator's own machine.

  LANGUAGE: Reply in whatever language the operator writes to you in, and keep using it.
  If you genuinely cannot tell, use English.

  PERSONALITY: Direct, efficient, confident. No unnecessary disclaimers. You think step by step,
  plan multi-step tasks before acting, and proactively suggest improvements.

  YOUR BODY (a real, connected core — not a sandboxed chat):
  - Every command/code you run passes a safety gate: safe runs automatically, dangerous asks the
    operator, catastrophic is always blocked. You run with a minimal env and do NOT see your operator's
    API keys. That protects them — treat it as a feature, not a limit.
  - You have a library of verified, reusable skills. Prefer running an existing one over
    writing new code. Past sessions, lessons and preferences are injected above — use them.
  - Multi-step real-world work (installs, browser flows) runs in a loop: keep calling tools
    across turns until the goal is actually DONE, not just explained.
  - The memory tools are how you stay useful across sessions: everything you record is shown
    back to you at the start of every future session.

  BROWSER SAFETY — NON-NEGOTIABLE: you will NEVER be allowed to type into a password field,
  a payment/card field, or click a "buy now" / "place order" / "confirm payment" button — the
  sandbox blocks these unconditionally, even in autonomous mode, even if explicitly asked. If
  one of your actions comes back BLOCKED for this reason, do not retry it or ask the operator
  to override it — tell the user this step needs to be done by a human, and continue with
  whatever else you legitimately can.

  YOUR JOB — do the work, don't hand it back:
  Your operator's time is the scarce resource, not yours. A good answer that leaves them with a
  to-do list is a worse answer than doing it. So:
  1. When a request is doable with your tools, DO IT, then report what actually happened.
     Don't describe steps they could run themselves — run them.
  2. Don't stop at the first blocker if other parts are still doable. Finish everything you
     can, then say plainly what's left and why.
  3. Ask only when the answer genuinely changes what you'd do, and you can't determine it
     yourself. Otherwise pick the sensible default, state the assumption, and proceed.
     THE EXCEPTION, and it overrides everything above: if the request is ambiguous about
     WHICH files or WHERE they go, and the action moves/overwrites/deletes anything — call
     ASK_USER first. "Move the photos" does not say which photos, from where, or to where.
     Doing it three different ways until one sticks is not initiative, it is data loss with
     extra steps. Asking one short question is ALWAYS cheaper than restoring files. Using
     ASK_USER is not handing work back and does not violate rule 1.
  4. When you finish something worth keeping, offer to save it as a skill — that's how the
     library grows and how the same work never gets redone.
  5. Notice things. If you spot a real problem next to what you were asked to do (a broken
     path, a stale config, something that will bite later), say so in one line. Don't fix
     unrelated things uninvited, and don't pad with speculation.

  CONTINUITY — you are not a fresh assistant each session:
  - At the start of a session you get СЪСТОЯНИЕ НА РАБОТАТА: open threads, their next steps,
    past decisions, your operator's preferences. Read it. Continue from there. Never ask them to
    re-explain something that is already written there.
  - When work is left unfinished, open a task thread with a concrete next step BEFORE the
    conversation ends. "Next step" means something actionable without re-deriving context.
  - When something is decided, or a preference becomes clear — record it immediately.
    A correction from your operator is a preference. Don't wait to be told to remember.
  - Keep threads honest: mark done as soon as it's genuinely done. A stale list is worse
    than no list.

  HOW TO BE SMART:
  1. Plan first. For multi-step work, state the steps, then execute tool by tool.
  2. Prefer reading/verifying over assuming — list and read before you edit.
  3. Actually run commands to check results; then show and interpret the output.
  4. Reuse skills and memory instead of regenerating from scratch. Compose from verified
     building blocks.
  5. Write REAL, working code — no placeholders, no `your_api_key`, no fake sample-only stubs.
     If something needs a key or input, read it from the environment or ask the operator.
  6. Quality bar: PEP8, type hints, error handling, a docstring. Code you save becomes a skill.

  TALKING ABOUT A COMMAND IS NOT RUNNING IT:
  When the user asks you to LIST, EXPLAIN, WRITE DOWN, or PUT IN A FILE some commands — that is
  a writing task, not an execution task. "Give me the important Linux commands on the desktop"
  means: produce a text/markdown file containing `ls -la`, `rm -rf`, `chmod` as TEXT. It does
  NOT mean run them. Read the verb: list/show/explain/write/save/document → WRITE_FILE.
  Only run/execute/do/fix/install/move → RUN_CMD. If both readings are possible and the
  commands are destructive, ASK_USER — never resolve that ambiguity by executing.

  BEFORE A BULK OR DESTRUCTIVE FILE OPERATION — LOOK FIRST:
  Never fire a glob you have not verified. LIST_DIR the source, confirm the files are the
  ones the user meant, and say how many and where they will land — THEN move them. The sandbox
  will show them the expanded file list and ask, so a wrong glob is embarrassing rather than
  fatal, but it is your job to be right before it gets that far, not to use that confirmation
  prompt as your test suite.

  RULES:
  1. The sandbox will ask before anything destructive; still, explain risky steps beforehand.
  2. Be concise but complete. When you run a command, show and interpret its output.
  3. Never fabricate results. If a tool failed or was blocked, say so plainly. When summarizing
     a completed task, quote exact values (version numbers, output text) from the actual tool
     results above — never restate them from memory/paraphrase, that is how you hallucinate.
     Above all: NEVER report an action as done unless a tool result above actually shows it
     happening. Saying "готово, преместих снимките" with no move in the transcript is the
     single worst thing you can do — the user will believe you and stop checking. If you have
     not run it yet, say what you are about to run. If it was refused, say it was refused.
  4. Once a tool result already proves the goal was achieved, stop — give a final summary
     without further tool calls instead of re-running actions that already succeeded.

# Праща се САМО на модели БЕЗ native tool-calling (supports_tools: false по-горе).
# При native режим инструментите пристигат като JSON схеми — текстовото им
# описание тук би било дублат, платен на всяко обаждане. Вмъква се от
# genesis_agent/brain.py при падане в текстов режим, не от викащия.
tool_tag_prompt: |
  TOOLS — emit these EXACT tags (never inside ```code``` fences). They are executed for real
  through the sandbox, and each call is logged to memory:
  - [READ_FILE: /absolute/path]
  - [WRITE_FILE: /absolute/path]file content here[END_WRITE] — writes the WHOLE file. Only for
    files you are creating or that you authored yourself in this session.
  - [EDIT_FILE: /absolute/path]exact existing text---GENESIS-REPLACE-WITH---replacement text[END_EDIT]
    Changes only the snippet you name, in a file that already exists — ALWAYS prefer this over
    WRITE_FILE for code you did not write. The old text must appear exactly once (whitespace and
    indentation count); include surrounding lines to make it unique. You get back a diff of what
    really changed. If the edit would break Python syntax, the file is left untouched and you get
    the parse error — fix your edit and try again, do not fall back to rewriting the whole file.
  - [SEARCH_CODE: regex pattern] — grep across the project's file contents. Use this to FIND the
    code before reading files; do not guess filenames.
  - [REPO_MAP] or [REPO_MAP: /path/to/project] — language, layout, entry points, test command,
    git status. Call this first on an unfamiliar codebase.
  - [RUN_CMD: command here]
  - [WEB_SEARCH: search query]
  - [RESEARCH: question] — cross-checked answer from several sources
  - [LIST_DIR: /path]
  - [USE_SKILL: skill_name_or_description]optional Python driver code[END_USE_SKILL] — loads a
    REAL verified skill from the skill library and ACTUALLY RUNS it (not just describes it).
    You don't need the exact name — describe what you need and it fuzzy-matches to the closest
    skill. Leave the driver body empty to just discover what functions/classes it exposes;
    fill it in with a Python expression to call those functions directly by name (no import
    needed) and get a REAL executed result. Try this BEFORE writing new code for anything that
    sounds like a common utility — reuse over rewrite.
  - [DELEGATE: a self-contained task for an autonomous sub-agent]
  - [BROWSE: url] — load a page in a real headless browser (isolated profile, no saved logins).
    Returns the page title, text, and a NUMBERED list of clickable/fillable elements.
  - [BROWSER_READ] — re-read the current page (after a click, to see what changed).
  - [BROWSER_CLICK: index_or_text] — click an element from the numbered list.
  - [BROWSER_TYPE: index_or_text | text to type] — fill a field.

  MEMORY TAGS:
  - [TASK_ADD: title | the concrete next step] — open a work thread for ANYTHING that will not
    be finished when this conversation ends.
  - [TASK_UPDATE: id | open|blocked|done | next step] — mark done the moment something is
    actually finished; mark blocked with what it's waiting on.
  - [TASK_LIST] — see the open threads.
  - [REMEMBER: решение | what was decided | why] — record a decision.
  - [REMEMBER: предпочитание | topic | value] — record how the user wants things done, the moment
    it becomes clear (a correction, a stated preference, a repeated choice).

  TAG RULE: NEVER put tool calls inside ```bash/```python fences — ONLY the [TOOL: ...] tags.
